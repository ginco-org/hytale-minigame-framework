# CI for the minigame framework.
#
# `build` compiles the plugin and its integration-test sources — no Hytale
# account needed. `integration` boots a real server and runs the suite, which
# needs a cached Hytale `auth:server` token (repository secret
# HYTALE_TOKEN_JSON, written to the path hytest's GameSession reads) — so it
# only does real work on main pushes and manual dispatch.
#
# The integration tests consume hytest as a composite build from a SIBLING
# checkout (../hytest) — both repositories are checked out side by side here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The Hytale refresh token is use-once rotated (see hytest's ci.yml rationale):
# serialize integration runs and carry the rotated token forward via the cache.
# Per-ref: a new push cancels the superseded run of the same branch — the
# integration suite costs ~30 min on a 2-core runner (world-disposal pipeline:
# 5s chunk-load timeout + ~25s chunk save per per-test world), so don't burn
# runners on stale commits. Run the suite locally instead: ~1 min end to end.
# The Hytale refresh-token rotation stays safe: integration only runs on
# main/dispatch, and warm server-cache runs never touch the OAuth token.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (plugin + test sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ginco-org/hytale-codec
          path: hytale-codec
          token: ${{ secrets.GH_CHECKOUT_TOKEN }}
      # The org's workflow-token permission is set to "read" for all org
      # repos, so the default GITHUB_TOKEN can check out the sibling repos.
      - uses: actions/checkout@v4
        with:
          repository: ginco-org/hytest
          path: hytest
          token: ${{ secrets.GH_CHECKOUT_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish hytale-codec to mavenLocal
        run: cd hytale-codec && ./gradlew publishToMavenLocal
      - name: Compile plugin and test sources
        run: ./gradlew compileKotlin compileHytaleTestKotlin jar --no-build-cache

  integration:
    name: Integration (suite on a real server)
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ginco-org/hytale-codec
          path: hytale-codec
          token: ${{ secrets.GH_CHECKOUT_TOKEN }}
      # The org's workflow-token permission is set to "read" for all org
      # repos, so the default GITHUB_TOKEN can check out the sibling repos.
      - uses: actions/checkout@v4
        with:
          repository: ginco-org/hytest
          path: hytest
          token: ${{ secrets.GH_CHECKOUT_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # Rotation chain: restore the LATEST cached token, save the rotated one
      # at job end (see hytest's ci.yml for the full rationale).
      - name: Restore Hytale token
        uses: actions/cache@v4
        with:
          path: ~/.local/share/hygradle/token.json
          key: hytale-downloader-token-${{ github.run_id }}
          restore-keys: |
            hytale-downloader-token-
      # Server files (jar 110MB + Assets.zip 3.3GB) cached by version — the
      # authenticated R2 download only happens on version bump or cold cache.
      - name: Restore Hytale server files
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/caches/hygradle/server
          key: hytale-server-0.6.8-${{ github.run_id }}
          restore-keys: |
            hytale-server-0.6.8-
            hytale-server-
      # Save even when the suite fails — otherwise every red run also pays
      # the 3.3GB authenticated download again.
      - name: Save Hytale server files
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/caches/hygradle/server
          key: hytale-server-0.6.8-${{ github.run_id }}
      - name: Check for Hytale token secret
        id: token
        env:
          HYTALE_TOKEN_JSON: ${{ secrets.HYTALE_TOKEN_JSON }}
        run: |
          if [ -n "$HYTALE_TOKEN_JSON" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "HYTALE_TOKEN_JSON not set — skipping integration tests."
          fi
      - name: Install Hytale downloader token
        if: steps.token.outputs.available == 'true'
        env:
          HYTALE_TOKEN_JSON: ${{ secrets.HYTALE_TOKEN_JSON }}
        run: |
          mkdir -p ~/.local/share/hygradle
          # Seed ONLY when the rotation chain had no cached token (first run,
          # cache eviction) — overwriting a restored token would clobber the
          # newest rotated refresh token and break the chain. The DOWNLOADER
          # token is what provisionServer authenticates with; access tokens
          # auto-refresh and session tokens are optional for this suite.
          if [ ! -s ~/.local/share/hygradle/token.json ]; then
            printf '%s' "$HYTALE_TOKEN_JSON" > ~/.local/share/hygradle/token.json
            echo "seeded token.json from HYTALE_TOKEN_JSON"
          else
            echo "token.json restored from cache — keeping the latest rotated token"
          fi
      - name: Run integration suite
        if: steps.token.outputs.available == 'true'
        run: ./gradlew hytaleTest -PhytestLogs --no-build-cache
