# CI for the minigame framework.
#
# `build` compiles the plugin and its integration-test sources — no Hytale
# account needed. `integration` boots a real server and runs the suite, which
# needs a cached Hytale `auth:server` token (repository secret
# HYTALE_TOKEN_JSON, written to the path hytest's GameSession reads) — so it
# only does real work on main pushes, nightly schedules and manual dispatch.
#
# Suite split (issue #1): `MinigameInstanceWorldTest` alone spent ~227s of a
# ~460s test phase — every instance world pays create + join + settle + stop +
# teardown, by design. The fast tier (`-PhytestFast`, see build.gradle.kts)
# excludes the whole class, so main-branch integration gives its signal in
# minutes, not tens of minutes. The nightly schedule and explicit dispatches
# (`suite: full`) run the complete suite on a real server, which is where a
# multi-minute-per-test cost can be paid deliberately.
#
# Two servers on a bigger runner (issue #1, suggestion 5) is deliberately
# NOT implemented: the engine boots one ephemeral server per `hytaleTest`
# invocation and the runner is 2-core, so a second invocation's server shares
# cores with the first and total wall time does not improve.
#
# Each integration run consumes hytest as plain dependencies from Maven Central
# (no composite build, no PAT since hytale-minigame-framework@b11491b).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:40 UTC daily — the full suite (fast tier keeps main-push runs short;
    # nightly is the place where minute-per-test wall time is acceptable).
    - cron: '40 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'hytaleTest scope'
        required: false
        type: choice
        default: fast
        options: [fast, full]

permissions:
  contents: read

# The Hytale refresh token is use-once rotated (see hytest's ci.yml rationale):
# serialize integration runs and carry the rotated token forward via the cache.
# Per-ref: a new push cancels the superseded run of the same branch — do not
# burn runners on stale commits. The Hytale refresh-token rotation stays safe:
# integration only runs on main/dispatch/schedule, and warm server-cache runs
# never touch the OAuth token. A pushed main commit cancels an in-flight
# nightly run and takes over the same rotation chain cleanly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (plugin + test sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile plugin and test sources
        run: ./gradlew compileKotlin jar --no-build-cache

  integration:
    name: Integration (real server)
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The suite's test server must carry the Kotlin runtime carrier (the
      # framework's manifest hard-depends on it); build the pinned release
      # before the suite runs. Public repo — the default token suffices.
      - uses: actions/checkout@v4
        with:
          repository: ginco-org/kotlin-for-hytale
          ref: v0.1.0
          path: kotlin-for-hytale
      - name: Build carrier jar
        run: cd kotlin-for-hytale && ./gradlew jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # Rotation chain: restore the LATEST cached token, save the rotated one
      # at job end (see hytest's ci.yml for the full rationale).
      - name: Restore Hytale token
        uses: actions/cache@v4
        with:
          path: ~/.local/share/hygradle/token.json
          key: hytale-downloader-token-${{ github.run_id }}
          restore-keys: |
            hytale-downloader-token-
      # Server files (jar 110MB + Assets.zip 3.3GB) cached by version — the
      # authenticated R2 download only happens on version bump or cold cache.
      - name: Restore Hytale server files
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/caches/hygradle/server
          key: hytale-server-0.6.8-${{ github.run_id }}
          restore-keys: |
            hytale-server-0.6.8-
            hytale-server-
      # Save even when the suite fails — otherwise every red run also pays
      # the 3.3GB authenticated download again.
      - name: Save Hytale server files
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/caches/hygradle/server
          key: hytale-server-0.6.8-${{ github.run_id }}
      - name: Check for Hytale token secret
        id: token
        env:
          HYTALE_TOKEN_JSON: ${{ secrets.HYTALE_TOKEN_JSON }}
        run: |
          if [ -n "$HYTALE_TOKEN_JSON" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "HYTALE_TOKEN_JSON not set — skipping integration tests."
          fi
      - name: Install Hytale downloader token
        if: steps.token.outputs.available == 'true'
        env:
          HYTALE_TOKEN_JSON: ${{ secrets.HYTALE_TOKEN_JSON }}
        run: |
          mkdir -p ~/.local/share/hygradle
          # Seed ONLY when the rotation chain had no cached token (first run,
          # cache eviction) — overwriting a restored token would clobber the
          # newest rotated refresh token and break the chain. The DOWNLOADER
          # token is what provisionServer authenticates with; access tokens
          # auto-refresh and session tokens are optional for this suite.
          if [ ! -s ~/.local/share/hygradle/token.json ]; then
            printf '%s' "$HYTALE_TOKEN_JSON" > ~/.local/share/hygradle/token.json
            echo "seeded token.json from HYTALE_TOKEN_JSON"
          else
            echo "token.json restored from cache — keeping the latest rotated token"
          fi
      # Nightly and explicit `suite: full` dispatches run the complete suite;
      # main pushes run the fast tier (instance-world tests excluded, see
      # build.gradle.kts) so the always-on signal stays minutes instead of
      # tens of minutes long.
      - name: Determine suite scope
        id: suite
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.suite }}" = "full" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "scope=full" >> "$GITHUB_OUTPUT"
          else
            echo "flag=-PhytestFast" >> "$GITHUB_OUTPUT"
            echo "scope=fast (instance-world tests excluded)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run integration suite
        if: steps.token.outputs.available == 'true'
        # The server JVM needs a 5G heap (the suite outgrew hytest's 4G default
        # at ~75 tests — see build.gradle.kts), and ubuntu-latest runners have
        # 7G: cap the Gradle daemon so daemon + test worker + server fit. The
        # daemon is idle while the server runs.
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx1g
        run: ./gradlew hytaleTest ${{ steps.suite.outputs.flag }} -PhytestLogs --no-build-cache --refresh-dependencies
